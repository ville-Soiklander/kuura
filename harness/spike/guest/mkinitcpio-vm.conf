# mkinitcpio drop-in for the VM guest (installed as /etc/mkinitcpio.conf.d/vm.conf).
#
# Direct kernel boot with the root file system on a virtio block device. The
# modules are listed explicitly and `autodetect` is deliberately absent, so the
# result does not depend on the machine that builds the image.
MODULES=(virtio_blk virtio_pci virtio_gpu ext4)
HOOKS=(base udev modconf block filesystems)
