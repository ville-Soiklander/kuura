# Read by the systemd --user manager at session start (systemd's own
# environment.d(5) mechanism), BEFORE any user unit starts - moved here from
# ~/.config/plasma-workspace/env/20-gtk-appmenu.sh on 2026-10-16, the same
# migration and reasoning as this directory's own 10-vm-rendering.conf (see
# its header comment for the full incident). Confirmed live and REQUIRED,
# not optional, on this pre-baked screenshot-harness image (harness/vm/
# Containerfile's own comment on the `appmenu-gtk-module` package): without
# this module loaded, kappmenu still activates com.canonical.AppMenu.Registrar's
# D-Bus name but no window ever registers a menu with it, so the panel's
# Global Menu widget stays empty for the `app-menu-gtk` state's own GTK3 app.
#
# No "export" keyword and no quoting (unlike the old env/*.sh form): this is
# systemd's own KEY=VALUE config syntax, not a shell script - see
# environment.d(5).
GTK_MODULES=appmenu-gtk-module
