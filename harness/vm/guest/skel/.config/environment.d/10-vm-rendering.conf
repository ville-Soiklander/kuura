# Read by the systemd --user manager at session start (systemd's own
# environment.d(5) mechanism), BEFORE any user unit - including
# plasma-kwin_wayland.service - is started. This replaces this file's former
# home at ~/.config/plasma-workspace/env/10-vm-rendering.sh, which relied on
# Plasma's own ad-hoc startup script to source *.sh files and import the
# result into systemd; that path was found unreliable in a real
# harness.install.run boot (docs/ISO_CONTRACT.md "Installed-system
# verification", 2026-10-16): kwin_wayland crash-looped attempting hardware
# EGL against /dev/dri/card0 and neither this file's variables nor the real
# product's own env/*.sh variables (GTK_THEME, GTK_MODULES) ever reached
# `systemctl --user show-environment`. environment.d is parsed directly by
# systemd itself, with no dependency on Plasma's own startup script or its
# timing, so it is not exposed to that failure mode either way.
#
# TEST IMAGE ONLY - never shipped to a real install. harness.install.wizard's
# inject_test_only_session_config() copies this exact file onto a real,
# freshly-installed target at verify-time only (see that function's own
# docstring); this file is the source it reads from. Rendering settings for
# a guest WITHOUT a GPU: Mesa picks the software rasteriser (llvmpipe) when
# no hardware 3D driver is available.
#
# MESA_LOADER_DRIVER_OVERRIDE=kms_swrast REMOVED 2026-10-16 (project owner's
# explicit choice, `AskUserQuestion`): once the environment.d delivery fix
# above actually let these variables reach the session for the first time
# (previously NEITHER variable was landing - see this directory's own
# header comment history), kwin_wayland started segfaulting every time in
# EglBackend::ensureGlobalShareContext() right after `eglInitialize failed
# "EGL_NOT_INITIALIZED"` while opening /dev/dri/card0 - a NEW, worse failure
# than before (0/22 states reached, vs. a crash-loop that still eventually
# got a working desktop up). Key evidence: the very first successful
# install-verify run, long before this file (or any rendering override) had
# ever been written, already got a working desktop via kwin's OWN automatic
# hardware/software fallback on this exact VM config - the only defect was
# cosmetic (opaque panel/shelf instead of this project's translucent "frost"
# material), never a crash. That proves kwin's default fallback already
# handles "no GPU here" correctly without any override; forcing the loader
# to `kms_swrast` specifically appears to bypass whatever auto-detection
# path kwin's default behaviour relies on, in a way this kwin/Mesa version
# combination (kwin 6.7.5, mesa 1:26.2.3-1) cannot recover from.
# LIBGL_ALWAYS_SOFTWARE=1 alone is a weaker, broader hint (software
# rendering, whichever driver Mesa's own probe selects) rather than forcing
# one specific loader - kept alone to test whether it reproduces the
# original cosmetic frost-rendering fix without the crash. See
# docs/ISO_CONTRACT.md's "Installed-system verification" section for the
# full incident; NOT YET independently verified to fix the crash as of this
# comment - that verification is the immediate next step.
#
# CORRECTION (2026-10-20, GPU-display spike): kwin_wayland on DRM ignores
# LIBGL_ALWAYS_SOFTWARE; it was observed to get hardware GL whenever the VM has a
# 3D-capable display device (virtio-vga-gl + virgl). In this harness the software
# rendering therefore comes from the EMULATED NON-3D DISPLAY DEVICE (plain VGA, no
# DRI render node), not from this variable. The setting is kept unchanged; do not
# rely on it to force software rendering. See docs/HARNESS_CONTRACT.md, "GPU
# display mode".
#
# No "export" keyword and no quoting (unlike the old env/*.sh form): this is
# systemd's own KEY=VALUE config syntax, not a shell script - see
# environment.d(5).
LIBGL_ALWAYS_SOFTWARE=1
