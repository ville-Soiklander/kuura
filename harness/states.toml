# State and mode definitions of the screenshot harness.
# Schema: docs/HARNESS_CONTRACT.md ("states.toml"); validated by harness/shots/states.py.
#
# Every coordinate is in PHYSICAL pixels of the 2560x1440 display (output scale 2, so
# logical 1280x720). V3 (docs/SHELL_CONTRACT.md) made the panel layout real
# (desktop-empty, menubar-open, shelf-hover now describe the real menubar/shelf, not a
# stand-in). Everything else still stands in for a bespoke surface that does not exist
# yet (overview, search-open, and the window decoration seen in every *-window state,
# still a generic titlebar - see SHELL_CONTRACT's "Known issue"); the description of
# each such state says which stock component plays the role.

[settings]
resolution = [2560, 1440]
settle_frames = 2
settle_interval_s = 1.0
settle_timeout_s = 45
# Must be later than the archive snapshot date (else the guest clock jumps forward).
rtc_base = "2026-09-25T12:00:00"

# Steps that run before EVERY state, so each state starts from the same empty desktop:
#   1. close any open menu, overlay or runner
#   2. stop the programs the states start (and wait until they are really gone, or the
#      next screenshot could still show the closing window) and close every
#      notification (the ids restart at 1 in a fresh session, so a small range is enough)
#   3. park the pointer on the bare desktop, away from every panel icon (a tooltip or
#      hover highlight left behind would leak into the next state)
reset = [
    { key = "escape" },
    { key = "escape" },
    { run = ["sh", "-c", "pkill -x 'dolphin|systemsettings|firefox|mousepad|gtk4-widget-factory'; for n in $(seq 1 60); do pgrep -x 'dolphin|systemsettings|firefox|mousepad|gtk4-widget-factory' >/dev/null || break; sleep 0.2; done; for id in 1 2 3 4 5 6; do gdbus call --session --dest org.freedesktop.Notifications --object-path /org/freedesktop/Notifications --method org.freedesktop.Notifications.CloseNotification \"$id\" >/dev/null 2>&1; done; true"], wait_exit = true },
    { move = [1280, 700] },
]

[defaults]
tolerance = 3
max_diff_ratio = 0.0005
# The panel clock. V3 moved it from the bottom-right of the old single stock panel
# into the top-right of the new, real 52px-tall (26 logical px) top menubar panel -
# measured live from a real screenshot of the packaged image (not guessed from the
# token value alone): the "12:00 PM" / date text sits inside roughly x=[2450,2560],
# y=[5,50]; this mask is padded on both axes for different digit widths/dates.
mask = [[2420, 0, 2560, 55]]

[modes.light]
scheme = "light"
[modes.dark]
scheme = "dark"

[[state]]
name = "desktop-empty"
description = "Empty desktop with the real panel layout: a top menubar (application menu button, Global Menu, system tray, clock) and a floating bottom shelf (Icons-only Task Manager)."
steps = []

[[state]]
name = "menubar-open"
description = "Application launcher (Kickoff) opened by a click on its icon at the left end of the real top menubar."
steps = [
    { click = [26, 26] },
    { settle = true },
]

[[state]]
name = "shelf-hover"
description = "Pointer resting on a task icon in the real floating bottom shelf (highlight and tooltip)."
steps = [
    { move = [1089, 1420] },
    { wait = 2 },
    { settle = true },
]

[[state]]
name = "overview"
description = "Overview effect opened with its shortcut; the stock Overview effect plays the role of the future overview surface."
steps = [
    { key = "meta+w" },
    { settle = true },
]

[[state]]
name = "search-open"
description = "Runner opened with its shortcut and the word files typed; the stock runner plays the role of the future search surface."
steps = [
    { key = "alt+space" },
    { settle = true },
    { type = "files" },
    { settle = true },
]

[[state]]
name = "files-window"
description = "File manager window on the fixed sample folder; the stock file manager plays the role of the future files app."
steps = [
    { run = ["dolphin", "Documents"] },
    { settle = true },
]

[[state]]
name = "settings-window"
description = "System settings window; the stock settings application plays the role of the future settings app."
steps = [
    { run = ["systemsettings"] },
    { settle = true },
]

[[state]]
name = "notification"
# No bespoke component is coming here, unlike the other states in this file - see
# docs/HARNESS_CONTRACT.md's own note on this state for why (confirmed against the
# real KDE source: the stock pop-up already follows the active colour scheme).
description = "Desktop notification with a fixed summary and body that stays until closed; uses Plasma's own stock notification pop-up, confirmed to already follow the active colour scheme."
steps = [
    { run = ["notify-send", "--app-name", "harness", "--expire-time", "0", "Sample notification", "Body text of the sample notification"] },
    { settle = true },
]

[[state]]
name = "browser-window"
description = "Test browser window on a local static page; the stock browser plays the role of the future browser window."
steps = [
    { run = ["harness-browser"] },
    { settle = true },
]

# GTK half of the global-menu DoD (docs/SHELL_CONTRACT.md's "Verification" section,
# point 1). Firefox was verified live NOT to qualify (see the implementing agent's
# report: no com.canonical.AppMenu.Registrar activity, and its own window shows no
# traditional menu bar), so the project's own documented fallback applies - a small,
# explicitly test-only GTK application, following harness-browser's precedent
# (Mousepad + appmenu-gtk-module, see harness/vm/Containerfile and
# guest/skel/.config/plasma-workspace/env/20-gtk-appmenu.sh).
#
# STILL OPEN, reported rather than papered over (mirrors the KWin decoration "Known
# issue" in docs/SHELL_CONTRACT.md): live testing confirms Mousepad's OWN in-window
# menu bar disappears once appmenu-gtk-module is loaded (it hands its menu off) and
# the D-Bus registrar/proxy services activate - but the panel's Global Menu widget
# still renders NOTHING for it, even though the exact same widget correctly shows
# Dolphin's (Qt) menu in this same image. The gap is therefore narrower than "GTK
# menus do not work at all": it is specifically the KWin/XWayland-side relay from an
# appmenu-gtk-module-exported window to the panel widget, not proven here to be
# fixable without a deeper investigation than this state's own scope. Treat any
# goldens captured for this state as showing the CURRENT (empty) Global Menu area for
# a GTK app, not a working one - say so in the review rather than approving it as
# correct.
[[state]]
name = "app-menu-gtk"
description = "Test-only GTK text editor (Mousepad) focused, its own menu bar suppressed; the Global Menu widget does not show it yet (open gap, see comment above)."
steps = [
    { run = ["mousepad", "Notes.txt"] },
    { settle = true },
]

# Beyond the working brief's own required minimum state list (docs/HARNESS_CONTRACT.md) -
# this project's harness already has states beyond that minimum for its own verification
# purposes (app-menu-gtk above is exactly this kind of addition). Added to finally close
# the long-open "does the shipped gtk-4.0/gtk.css / gtk-dark.css mechanism visibly do
# anything" question (docs/SHELL_CONTRACT.md's "GTK4/libadwaita" section): Firefox,
# previously the only GTK app in the test image, was confirmed to be the wrong test
# subject (it does not render its own chrome through GTK theme CSS at all).
# `gtk4-widget-factory` (from the `gtk4-demos` package, see harness/vm/Containerfile) is
# a plain GTK4 upstream demo with no libadwaita/portal dependency of its own, so it
# isolates the plain gtk-4.0 theme CSS mechanism from the already-proven
# xdg-desktop-portal mechanism instead of retesting the same thing twice.
#
# OPEN, reported rather than silently worked around (mirrors the KWin decoration
# "Known issue" and the app-menu-gtk Global Menu gap elsewhere in this project):
# confirmed live that this state never settles within settle_timeout_s (45s), always
# "timeout", not "never changed" -- the window itself renders correctly throughout
# (seen in the .FAILED diagnostic the harness saves on a timeout, inspected by eye in
# both attempts below). Two candidate causes were in play: (1) the window opens with
# keyboard focus on its first GtkEntry, whose caret blinks, and `runner.py`'s settle
# check is an EXACT pixel match (tolerance=0); (2) `runner.py`'s settle also requires
# the GUEST to be CPU-quiet between polls, independent of whether pixels changed. Two
# `tab` key presses (to move focus off the entry) were tried and made NO visible or
# functional difference whatsoever -- same timeout, pixel-identical final frame to the
# first attempt -- which rules out (1) and points at (2): this demo app most likely
# keeps the (software-rendered) guest busy continuously regardless of visible change.
# Not chased further (no per-state settle_timeout/MAX_BUSY_FRACTION override exists,
# and loosening either globally would weaken every other state's check). Real light-
# and dark-mode evidence for this state was instead captured directly from the
# harness's own .FAILED diagnostic frames (see this change's own handback for paths
# and a description of what they show) rather than from a passing golden capture.
[[state]]
name = "gtk4-widget-factory"
description = "GTK4 upstream demo app exercising buttons, entries, spinbuttons, tooltips and popovers; isolates this project's shipped gtk-4.0/gtk.css and gtk-dark.css theme from the already-proven portal mechanism."
steps = [
    { run = ["gtk4-widget-factory"] },
    { settle = true },
]
