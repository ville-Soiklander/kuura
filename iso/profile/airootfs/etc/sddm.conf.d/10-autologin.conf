#
# Live-session autologin (docs/ISO_CONTRACT.md, "Live session"). Mirrors
# harness/vm/Containerfile's own, already-verified autologin drop-in exactly (every
# golden screenshot in harness/goldens/ was captured through that mechanism):
# DisplayServer=wayland stops SDDM from starting an X server it would not use, and
# the live user below is created by airootfs/root/customize_airootfs.sh.
#
[General]
DisplayServer=wayland

[Autologin]
User=liveuser
Session=plasma
Relogin=false
