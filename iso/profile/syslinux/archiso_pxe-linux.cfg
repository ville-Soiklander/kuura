LABEL arch_nbd
TEXT HELP
Boot the @DISTRO_DISPLAY_NAME@ live system using NBD.
It allows you to install @DISTRO_DISPLAY_NAME@ or perform system maintenance.
ENDTEXT
MENU LABEL @DISTRO_DISPLAY_NAME@ live (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

