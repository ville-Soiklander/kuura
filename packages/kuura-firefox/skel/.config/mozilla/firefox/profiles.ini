; Default Firefox profile database, shipped to new accounts via /etc/skel so
; every user gets this project's preinstalled, themed profile on their very
; first launch instead of Firefox silently creating a fresh, blank one next
; to it.
;
; Firefox 156.0.1 keeps this file (and its own real profile data) at
; ~/.config/mozilla/firefox/ - the XDG Base Directory location - NOT the
; legacy ~/.mozilla/firefox/ path older guides and distro references still
; describe. Confirmed live: booting a real, never-run Firefox 156.0.1 in a
; fresh account (no prior profiles.ini/installs.ini at all) wrote its own
; profiles.ini to ~/.config/mozilla/firefox/profiles.ini, not ~/.mozilla/.
; Shipping this file at the legacy path would have been silently ignored.
;
; [InstallXXXXXXXXXXXXXXXX]: modern Firefox (67+, "profile-per-install") does
; not simply trust the legacy Profile0 Default=1 marker below - it looks up a
; section named "Install" + an uppercase-hex CityHash64 of THIS install's own
; resolved binary directory first, and only falls back toward Default=1 (and
; even then only if the target profile already has a compatibility.ini from a
; previous run - it does NOT for a profile that has never run, like this one)
; when no such section exists. The hash below, 4F96D1932A9F858E, is for the
; literal path "/usr/lib/firefox" (Arch's real firefox package install
; directory - confirmed: /usr/bin/firefox is a tiny "exec /usr/lib/firefox/
; firefox \"$@\"" wrapper script, so the actually-running binary's own
; resolved directory, which is what gets hashed, is /usr/lib/firefox, not
; /usr/bin), computed by porting Firefox's own vendored CityHash64 (Google's
; CityHash v1, other-licenses/nsis/Contrib/CityHash/cityhash/city.cpp in the
; Firefox source tree) exactly as toolkit/xre/nsXREDirProvider.cpp +
; toolkit/mozapps/update/common/commonupdatedir.cpp's GetInstallHash() do:
; UTF-16LE-encode the path (no trailing separator, no case folding needed on
; Linux), CityHash64 the raw bytes, format uppercase hex with no padding.
; NOT a guess: this value was then independently cross-checked two ways -
; (1) it matches Mozilla's own published worked example in their enterprise
; documentation and a real user's committed dotfiles, both for this exact
; path, and (2) far more importantly, a real, fresh Firefox 156.0.1 (this
; project's exact pinned version, from this exact pinned Arch Linux Archive
; snapshot) was booted from a genuinely never-run account with this shipped
; profiles.ini already in place, and its OWN, independently-computed
; installs.ini + profiles.ini matched this file's [InstallXXXX] section name
; byte for byte, and its post-launch profiles.ini was byte-identical to the
; one shipped here (no second, randomly-salted profile was created).
;
; "default-release" (this profile's own directory name below) is a real,
; plain name - not the random 8-character "salt" prefix Firefox normally
; generates for a profile it creates itself (e.g. "xf3oy3fn.default-release"
; in the live boot above) and not a placeholder like "xxxxxxxx" copy-pasted
; from an old guide's own illustrative example. A hand-placed, build-time
; profile does not need that salt (it exists to reduce the odds of a
; software collision when Firefox invents a NEW profile directory name at
; runtime, which does not apply here since this exact name is fixed and
; known in advance), and the live boot above confirms Firefox is completely
; happy to adopt a plain, unsalted directory name.

[General]
StartWithLastProfile=1
Version=2

[Profile0]
Name=default-release
IsRelative=1
Path=default-release
Default=1

[Install4F96D1932A9F858E]
Default=default-release
Locked=1
