# SPDX-FileCopyrightText: no
# SPDX-License-Identifier: CC0-1.0
#
# NOT a vendored default - unlike every other file in this directory, this
# module has no meaningful upstream example to start from (the real upstream
# shellprocess.conf at https://codeberg.org/Calamares/calamares tag v3.4.2 is
# a pure documentation/example file: a commented-out `touch`/`true`/
# `slowloris` demo, nothing this project would ship unchanged - see that same
# real file's own header comment for the full schema this config follows,
# confirmed from source: `dontChroot` (bool, default false = run IN the
# target chroot - what we want), `timeout` (seconds, global default 30),
# `verbose` (bool), `script` (a list of command strings, each run via
# `/bin/sh -c` separately - so pipes/redirects DO work inside one entry,
# unlike the *packages* module's pre/post-scripts which bypass the shell).
# Prefixing a command with "-" makes a failing command non-fatal (same
# convention make itself uses), used below for `rm -f` calls whose target
# may legitimately already be absent.
#
# PURPOSE (docs/ISO_CONTRACT.md, "Live-only cleanup", locked 2026-10-12):
# `unpackfs` copies the entire LIVE rootfs verbatim onto the target disk -
# every file, including ones that only make sense on the live medium. This
# job runs immediately after `unpackfs` (settings.conf.in's locked position)
# to delete those files from the target BEFORE any later module (`initcpio`,
# `displaymanager`, ...) runs against a target that still carries them.
#
# Every path below was found by a REAL diff, not guessed: `pacman -Qlq`
# (every file owned by any installed package) against the live rootfs's
# real file list (`find / -xdev -type f -o -type l`, scoped to exclude
# /proc, /sys, /run, /tmp, /home, /root), run against the real kuura ISO
# built this session (see this task's own report for the exact method -
# the live rootfs's squashfs had to be extracted with `unsquashfs`, not
# loop-mounted, because the kernel squashfs driver in the recon environment
# could not reliably decode this image's xz+BCJ-filtered fragments - a real,
# reproducible `SQUASHFS error: Unable to read fragment cache entry`
# confirmed in `dmesg`, NOT a kuura bug; `unsquashfs`, which uses full
# userspace liblzma, decoded every file correctly).
---
# Run in the target chroot (the default) - these files only make sense
# relative to the TARGET's own /etc, /usr/local, not the live session's.
dontChroot: false

# Generous timeout: deleting a handful of small files is instant, but the
# mkinitcpio preset regeneration (see below) touches the kernel's module
# tree and should not be cut off on slower disks.
timeout: 30

script:
    # ---- Bug #1 (docs/ISO_CONTRACT.md, confirmed 2026-10-12 by a real
    # install failing at the `initcpio` exec module): /etc/mkinitcpio.conf.d/
    # archiso.conf is owned by no package (`pacman -Qo` confirms this),
    # written directly into the live rootfs by archiso's own build process.
    # Its HOOKS= line only makes sense booting from a loop-mounted ISO/PXE
    # and makes `mkinitcpio -P` fail outright on the target. ----
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"

    # ---- Completion of bug #1, found by this task's own deeper audit (the
    # contract named ONLY the file above; deleting it alone is necessary but
    # NOT sufficient). /etc/mkinitcpio.d/linux.preset is ALSO owned by no
    # package (confirmed: `pacman -Qo` on the real extracted rootfs says "No
    # package owns" it; grepping every installed package's own `files` list
    # confirms neither `linux` nor `mkinitcpio` ships it directly - on real
    # Arch, this file is generated by a pacman hook,
    # /usr/share/libalpm/hooks/90-mkinitcpio-install.hook, calling
    # /usr/share/libalpm/scripts/mkinitcpio, NOT shipped as a package file).
    # On this ISO, archiso's build process left behind a copy whose own
    # PRESETS=('archiso') / archiso_config='/etc/mkinitcpio.conf.d/
    # archiso.conf' points straight at the file deleted above - so even
    # after that delete, Calamares' initcpio module (initcpio.conf's
    # `kernel: linux`, i.e. `mkinitcpio -p linux`) would still fail, now
    # looking for a preset config that no longer exists. ----
    - "-rm -f /etc/mkinitcpio.d/linux.preset"

    # ---- Bug #4 (docs/ISO_CONTRACT.md "Live-only cleanup", confirmed
    # 2026-10-13 by a real install running past both bugs above and failing
    # HERE instead): the mkinitcpio call below needs a readable
    # /boot/vmlinuz-linux, which mkarchiso's own build strips out of the
    # squashfs (see unpackfs.conf's own header for the full story and real
    # evidence) - fixed THERE, not here, because this module's chroot has its
    # own fresh tmpfs /run (modules/mount.conf's `extraMounts`, vendored
    # unchanged), which does NOT expose the live medium's
    # /run/archiso/bootmnt - unlike unpackfs, which runs unchrooted in the
    # live environment itself and already reads from that exact path for its
    # squashfs entry. By the time this script runs, unpackfs.conf's second
    # `unpack:` entry has already placed the real vmlinuz-linux +
    # initramfs-linux.img into the target's /boot/. ----

    # Regenerate it the REAL way instead of hand-writing its content: this
    # is the literal command pacman's own 90-mkinitcpio-install.hook runs
    # when the `mkinitcpio` package is installed/upgraded (confirmed from
    # /usr/share/libalpm/scripts/mkinitcpio's own source: its main loop reads
    # trigger target names from stdin, and a line that equals exactly
    # "mkinitcpio" with "install" as $1 calls generate_presets(), which
    # creates /etc/mkinitcpio.d/<pkgbase>.preset for every kernel under
    # /usr/lib/modules/*/pkgbase from the package's own real template,
    # /usr/share/mkinitcpio/hook.preset - producing the stock
    # PRESETS=('default') / ALL_kver="/boot/vmlinuz-linux" content, not a
    # guess). `echo mkinitcpio` simulates the exact Package-type trigger
    # pacman's hook mechanism itself would feed on stdin.
    - "echo mkinitcpio | /usr/share/libalpm/scripts/mkinitcpio install"

    # ---- Bug #2 (docs/ISO_CONTRACT.md, confirmed 2026-10-12): /etc/
    # sddm.conf.d/10-autologin.conf is this project's own live-session-only
    # file (iso/profile/airootfs/ - see "Live session" above), hardcoding
    # `User=liveuser`. Left on the target, SDDM would try to autologin a
    # user that does not exist there. ----
    - "-rm -f /etc/sddm.conf.d/10-autologin.conf"

    # ---- NEW finding, this task's own audit: /etc/systemd/system/
    # getty@tty1.service.d/autologin.conf is owned by no package (archiso's
    # own build process writes it, same mechanism as the two bugs above) and
    # UNCONDITIONALLY autologs tty1 in as root with no password
    # (`agetty --autologin root`). Unlike the two files above this is not
    # even gated by a kernel command-line condition - left in place, anyone
    # with local console access (Ctrl+Alt+F1, or a graphical-session crash)
    # gets an unauthenticated root shell on the installed target, directly
    # contradicting this project's own locked "no root password, sudo-only"
    # decision (modules/users.conf: setRootPassword: false). The most
    # severe of the files this audit found. ----
    - "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
    - "-rmdir /etc/systemd/system/getty@tty1.service.d"

    # ---- NEW finding: /etc/systemd/system/etc-pacman.d-gnupg.mount tmpfs-
    # mounts /etc/pacman.d/gnupg so the LIVE session's throwaway GPG trust
    # store never persists to the read-only squashfs. Left on an installed
    # target (a normal writable disk, where persistence is exactly what you
    # want), this would silently wipe pacman-key's trust database - any
    # imported keys - on every single reboot. Owned by no package. ----
    - "-rm -f /etc/systemd/system/etc-pacman.d-gnupg.mount"

    # ---- NEW finding: /etc/ssh/sshd_config.d/10-archiso.conf is this
    # project's own live-session-only override (iso/profile/airootfs/etc/
    # ssh/sshd_config.d/10-archiso.conf), enabling root+password SSH login -
    # a deliberate convenience for developer recon of the LIVE medium (used
    # throughout this project's own session), with no legitimate purpose on
    # an installed desktop. Removing it restores openssh's own stock,
    # secure-by-default sshd_config. ----
    - "-rm -f /etc/ssh/sshd_config.d/10-archiso.conf"

    # ---- NEW finding: /etc/motd tells the reader to "install Arch Linux"
    # and points at the live-only `Installation_guide`/iwctl/mmcli
    # convenience tools below - actively misleading on a system that is
    # already installed. Owned by no package (shipped by releng's airootfs
    # overlay, not a pacman package). ----
    - "-rm -f /etc/motd"

    # ---- NEW finding: dead live/PXE-only mirror-selection machinery.
    # /usr/local/bin/choose-mirror (owned by no package) only does anything
    # when booted with a `mirror=` kernel parameter (ConditionKernelCommand
    # Line=mirror in its own .service) - never true for a Calamares-
    # installed target's own grub-generated kernel command line - but it
    # and its two unit files/symlinks are dead weight worth cleaning up, the
    # same way the two confirmed bugs above are. ----
    - "-rm -f /usr/local/bin/choose-mirror"
    - "-rm -f /etc/systemd/system/choose-mirror.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/choose-mirror.service"

    # ---- NEW finding: dead accessibility-boot-flag-only live sound/speech
    # helper. /usr/local/bin/livecd-sound and its two .service units
    # (owned by no package) are gated by `ConditionKernelCommandLine=
    # accessibility=on`, never set on the installed target's own kernel
    # command line - and since this task's own package audit also removes
    # the `livecd-sounds` package (its sound files; see the package removal
    # list), leaving these enabled would reference files that no longer
    # exist. espeakup itself (the real accessibility screen reader bridge,
    # a KEPT general-purpose package per this task's own classification)
    # is unaffected - it is started independently, not by these. ----
    - "-rm -f /usr/local/bin/livecd-sound"
    - "-rm -rf /usr/local/share/livecd-sound"
    - "-rm -f /etc/systemd/system/livecd-talk.service"
    - "-rm -f /etc/systemd/system/livecd-alsa-unmuter.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/livecd-talk.service"
    - "-rm -f /etc/systemd/system/sound.target.wants/livecd-alsa-unmuter.service"

    # ---- NEW finding: /usr/local/bin/Installation_guide is a one-line
    # live-only convenience script (`exec xdg-open .../Installation_guide`)
    # with no purpose once a system is already installed. Owned by no
    # package. ----
    - "-rm -f /usr/local/bin/Installation_guide"

    # ---- NEW finding: per-machine identity/secret material that archiso's
    # build baked into the squashfs ONCE, at build time - unlike SSH host
    # keys (confirmed absent from this image; openssh generates those fresh
    # on first real boot via its own conditional systemd unit, the correct
    # pattern), these two are pre-generated and would otherwise be IDENTICAL
    # across every single kuura install made from this one ISO build.
    # /etc/nvme/{hostid,hostnqn} (NVMe-over-Fabrics host identity) and
    # /etc/brlapi.key (BRLTTY's local API auth secret) are both regenerated
    # automatically, by their own respective packages, the next time they
    # are needed if the file is absent - deleting them here is enough,
    # nothing further to configure. Owned by no package. ----
    - "-rm -f /etc/nvme/hostid"
    - "-rm -f /etc/nvme/hostnqn"
    - "-rm -f /etc/brlapi.key"

    # ---- Found 2026-10-13/14 by the install-verification harness's own real
    # end-to-end run (docs/ISO_CONTRACT.md "Installed-system verification"),
    # confirmed independently by mounting the resulting disk directly: the
    # live session's own `liveuser` account (uid 1000, created by archiso's
    # build the same way as every file above, not by any package) is NOT a
    # file `unpackfs` merely carries over - it is a full account unpackfs's
    # whole-rootfs copy brings along regardless, passwd/shadow/group entries
    # and a ~150K home directory included. Confirmed harmless as a privilege
    # path (`/etc/shadow` shows `liveuser:!:...` - locked, no valid password
    # hash, not in wheel/sudo) but a real, confirmed UX defect: it still
    # shows up in SDDM's own user list on first boot, and - more
    # consequentially - its uid 1000 pushes the real account Calamares'
    # users.conf creates to uid 1001 instead, breaking every tool in this
    # project (including harness/shots/guest.py's GuestUser) that assumes a
    # fresh install's first regular user lands on uid 1000. Same remediation
    # category as every finding above, just for an account instead of a
    # file: delete it, home directory included (`-r`), in the same
    # non-fatal style as this script's own `rm -f` convention. ----
    - "-userdel -r liveuser"
