#
# Unsquash / unpack a filesystem. Multiple sources are supported, and
# they may be squashed or plain filesystems.
#
# Configuration:
#
#   from globalstorage: rootMountPoint
#   from job.configuration: the path to where to mount the source image(s)
#       for copying an ordered list of unpack mappings for image file <->
#       target dir relative to rootMountPoint.

---
# Each list item is unpacked, in order, to the target system.
#
# Each list item has the following **mandatory** attributes:
#   - *source* path relative to the live / intstalling system to the image
#   - *sourcefs* the type of the source files; valid entries are
#       - `ext4` (copies the filesystem contents)
#       - `squashfs` (unsquashes)
#       - `file` (copies a file or directory)
#       - (may be others if mount supports it)
#   - *destination* path relative to rootMountPoint (so in the target
#       system) where this filesystem is unpacked. It may be an
#       empty string, which effectively is / (the root) of the target
#       system.
#
# Each list item **optionally** can include the following attributes:
#   - *exclude* is a list of values that is expanded into --exclude
#       arguments for rsync (each entry in exclude gets its own --exclude).
#   - *excludeFile* is a single file that is passed to rsync as an
#       --exclude-file argument. This should be a full pathname
#       inside the **host** filesystem.
#   - *weight* is useful when the entries take wildly different
#       times to unpack (e.g. with a squashfs, and one single file)
#       and the total weight of this module should be distributed
#       differently between the entries. (This is only relevant when
#       there is more than one entry; by default all the entries
#       have the same weight, 1)
#
# EXAMPLES
#
# Usually you list a filesystem image to unpack; you can use
# squashfs or an ext4 image. An empty destination is equivalent to "/",
# the root of the target system. The destination directory must exist
# in the target system.
#
#   -   source: "/path/to/filesystem.sqfs"
#       sourcefs: "squashfs"
#       destination: ""
#
# Multiple entries are unpacked in-order; if there is more than one
# item then only the first must exist beforehand -- it's ok to
# create directories with one unsquash and then to use those
# directories as a target from a second unsquash.
#
#   -   source: "/path/to/another/filesystem.img"
#       sourcefs: "ext4"
#       destination: ""
#   -   source: "/path/to/another/filesystem2.img"
#       sourcefs: "ext4"
#       destination: "/usr/lib/extra"
#
# You can list filesystem source paths relative to the Calamares run
# directory, if you use -d (this is only useful for testing, though).
#
#    -   source: ./example.sqfs
#        sourcefs: squashfs
#        destination: ""
#
# You can list individual files (copied one-by-one), or directories
# (the files inside this directory are copied directly to the destination,
# so no "dummycpp/" subdirectory is created in this example).
# Do note that the target directory must exist already (e.g. from
# extracting some other filesystem).
#
#    -   source: ../CHANGES
#        sourcefs: file
#        destination: "/tmp/derp"
#    -   source: ../src/modules/dummycpp
#        sourcefs: file
#        destination: "/tmp/derp"
#
# The *destination* and *source* are handed off to rsync, so the semantics
# of trailing slashes apply. In order to *rename* a file as it is
# copied, specify one single file (e.g. CHANGES) and a full pathname
# for its destination name, as in the example below.
#
# It is also possible to dynamically (conditionally) unpack a source by passing a boolean
# value for *condition*. This may be true or false (constant) or name a globalstorage
# value. Use '.' to separate parts of a globalstorage name if it is nested.
#
# This is used in e.g. stacked squashfses, where the user can select a specific
# install type. The default value of *condition* is true.
#
#    -   source: ./example.minimal.sqfs
#        sourcefs: squashfs
#        destination: ""
#        condition: false
#    -   source: ./example.standard.sqfs
#        sourcefs: squashfs
#        destination: ""
#        condition: exampleGlobalStorageVariable.subkey
#
# You may also wish to include optional squashfses, which may not exist at certain times
# depending on your image tooling. If an optional squashfs is not found, it is simply
# skipped.
#
#    -   source: ./example.standard.sqfs
#        sourcefs: squashfs
#        destination: ""
#    -   source: ./example.extras.sqfs
#        sourcefs: squashfs
#        destination: ""
#        optional: true

# ---- kuura's ONE flagged change from the real upstream example above (see this
# package's own PKGBUILD header for the "vendor + one flagged diff" discipline) ----
#
# Upstream's own default `unpack:` list (preserved verbatim in the comments above)
# unsquashes a dummy ../CHANGES file and the slideshow QML sources - it is its own
# documented non-functional example, not a real root filesystem source, and was
# never going to work for an actual install (docs/ISO_CONTRACT.md's own Vaihe 7
# brief left this exact wiring open on purpose, see packages/kuura-installer-config/
# PKGBUILD's header comment).
#
# Replaced with the REAL path of the live medium's own squashfs image, found
# empirically on a real booted ISO (kuura-2026.09.24-x86_64.iso, BIOS boot in
# QEMU/KVM, 2026-10-08) - not guessed from mkarchiso's docs or a third-party
# distro's example config, both of which were explicitly distrusted per this
# task's own instructions:
#
#   $ findmnt -t squashfs
#   TARGET                SOURCE     FSTYPE   OPTIONS
#   /run/archiso/airootfs /dev/loop0 squashfs ro,relatime,errors=continue,threads=single
#   $ losetup -a
#   /dev/loop0: []: (/run/archiso/bootmnt/arch/x86_64/airootfs.sfs)
#   $ findmnt -t iso9660
#   TARGET                SOURCE   FSTYPE  OPTIONS
#   /run/archiso/bootmnt  /dev/sr0 iso9660 ro,relatime,nojoliet,check=s,map=n,...
#
# So: the boot medium (whatever device it actually is - CD-ROM in this QEMU test,
# a USB block device on real hardware, archiso's own generic.* bootstrap handles
# the detection) is mounted read-only at /run/archiso/bootmnt, and the live
# system's own squashfs image sits at arch/x86_64/airootfs.sfs underneath that -
# matching this profile's own iso_name/arch layout (iso/profile/profiledef.sh).
# It is loop-mounted at /run/archiso/airootfs, which is where the live session's
# own root filesystem overlay comes from - confirming this is really the live
# system's rootfs squashfs, not some unrelated image.
#
# Only ONE flat squashfs layer exists on this profile (confirmed above: a single
# `findmnt -t squashfs` row) - no stacked/layered images to enumerate, so the
# simple single-entry form from the real upstream docs above applies directly.
# destination: "" unpacks to the root of the target system, matching upstream's
# own documented meaning for an empty destination.
#
# ---- SECOND flagged change, added 2026-10-13 after a real install got all the
# way to Users/Summary/Install and failed in `shellprocess`'s mkinitcpio call:
# `==> ERROR: Invalid option -k -- '/boot/vmlinuz-linux' must be readable`
# (full evidence in docs/ISO_CONTRACT.md "Live-only cleanup"). Root cause,
# confirmed by directly inspecting BOTH the target (mounted read-only) and the
# live system's own /boot/: both are completely empty. This is not a kuura bug
# - mkarchiso's own build process moves /boot/vmlinuz-linux and
# /boot/initramfs-linux.img OUT of airootfs and into the ISO9660 media's own
# /arch/boot/x86_64/ directory before squashing it, so the live medium's
# bootloader can load them straight from the ISO9660 filesystem without the
# squashfs carrying a redundant copy - which also means the squashfs entry
# above never contained them to unpack in the first place. Confirmed present
# at the real path below with real sizes (17 240 576 / 246 201 736 bytes) on
# the same booted ISO the squashfs path above was confirmed against.
#
# A second `unpack:` entry, run AFTER the squashfs entry (so the target's
# /boot/ directory already exists to receive it - the real upstream docs
# above explicitly describe this ordering: "it's ok to create directories
# with one unsquash and then use those directories as a target from a second
# unsquash"), with `sourcefs: file` (copies a directory's CONTENTS into
# destination, no nested "x86_64/" subdirectory - confirmed from the real
# v3.4.2 source, the same semantics the upstream dummycpp example above
# documents). This is a bit-identical restoration of the exact bytes
# mkarchiso's own build relocated elsewhere for ISO-size reasons, put back
# where an installed system (not a loop-mounted ISO) actually needs them -
# not a workaround. unpackfs runs unchrooted in the live environment itself
# (unlike `shellprocess`, see that module's own header), so it has direct
# access to this live-medium path the same way it already does for the
# squashfs entry above.
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64"
        sourcefs: "file"
        destination: "/boot"
