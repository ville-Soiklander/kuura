#
# NOT vendored unchanged - unlike most files in this directory, the real
# upstream default (https://codeberg.org/Calamares/calamares, tag v3.4.2,
# src/modules/packages/packages.conf) ships `backend: dummy` and a
# vi/wget/binutils install+remove EXAMPLE, not something any real distro
# would use as-is. The full real documentation for every key below
# (confirmed from that same real source, not invented) is kept as comments
# here as usual; only the documented, deliberately-decided keys are set.
#
# PURPOSE (docs/ISO_CONTRACT.md, "Live-only cleanup", locked 2026-10-12):
# `unpackfs` copies the entire live rootfs verbatim, including every
# releng rescue-medium package this project's own package audit classified
# as rescue/live-boot/diagnostic-only or redundant once Calamares has
# already installed the system (the same logic docs/ISO_CONTRACT.md already
# applies to `archinstall`, extended here to everything else that matches).
# Position: after `shellprocess` in the exec sequence (settings.conf.in),
# so the live-only *files* shellprocess.conf deletes are already gone
# before pacman's own transaction hooks run against the target.
---
# backend: pacman - the target is an Arch-based system; this is the only
# backend this project ever configures Calamares with.
backend: pacman

#
# Often package installation needs an internet connection.
# Since you may allow system installation without a connection
# and want to offer OPTIONAL package installation, it's
# possible to have no internet, yet have this packages module
# enabled in settings.
#
# You can skip the whole module when there is no internet
# by setting "skip_if_no_internet" to true.
#
# ---- REAL BUG, found+fixed 2026-10-13 via a real install + the real
# Calamares v3.4.2 source (src/modules/packages/main.py's run()): this key
# used to be `true` here, on the (wrong) assumption that it only gated
# *install* operations - "a plain remove of already-installed packages
# needs no network at all". The real source does not make that
# distinction: `skip_this = ...get("skip_if_no_internet", False)` /
# `if skip_this and not hasInternet: return None` runs BEFORE the
# `operations` list (install OR remove) is even read, so `true` here
# skipped this module's entire body - including the `remove` list below -
# on any offline install. Confirmed by direct evidence, not guessed: two
# real installs in the project's own offline QEMU test harness (`-nic
# none`) both produced a clean Finish page with NONE of the 21 packages
# below actually removed, and both Calamares session.log captures show
# exactly `WARNING: [PYTHON JOB]: "Package installation has been skipped:
# no internet"` as job 12/31's entire output - no pacman invocation at
# all. (The two targets' divergent-looking states when first inspected,
# 9/20 vs 0/21, turned out to be a measurement artifact of this task's own
# throwaway verify_target.sh - see that script's own header - not a real
# difference; a stable re-check, `ls /var/lib/pacman/local | sort` to a
# file once then grepping the static snapshot, gave 21/21 STILL PRESENT on
# both targets identically.)
#
# The original reasoning ("a plain remove needs no network") was actually
# correct - it just needs to be expressed by NOT setting this flag at all,
# rather than by setting it to true. Leaving it unset (real upstream
# default: false, confirmed from the same source) means this module's
# `operations` always run, online or not - exactly what a remove-only
# config needs, and real hardware installs (unlike this offline QEMU
# harness) will have internet anyway so this was never going to matter
# there - it only ever broke the project's own offline test loop.
skip_if_no_internet: false

# update_db: false - refreshing the sync databases is pointless (and a
# needless network dependency/failure point) for a plain `remove`
# operation; nothing here installs anything that would need an up to date
# database.
update_db: false
ignore_update_db_error: true

# update_system: false - this module only removes a fixed, deliberately
# audited list of packages; it must not also perform a surprise full
# system upgrade during install.
update_system: false

# pacman specific options
#
# *num_retries* should be a positive integer which specifies the
# number of times the call to pacman will be retried in the event of a
# failure.  If it is missing, it will be set to 0.
#
# *disable_download_timeout* is a boolean that, when true, includes
# the flag --disable-download-timeout on calls to pacman.  When missing,
# false is assumed.
#
# *needed_only* is a boolean that includes the pacman argument --needed
# when set to true.  If missing, false is assumed.
#
# None of these matter for a plain `remove` (no downloads happen), kept at
# their real upstream defaults.
pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: false

#
# List of maps with package operations such as install or remove.
# See this file's own real upstream documentation (preserved below) for the
# full *install*/*try_install*/*localInstall*/*remove*/*try_remove* schema.
#
# operations: a single `remove` list - this project's own real classification
# of iso/profile/packages.x86_64's releng portion (see this task's own report
# for the full per-package reasoning, one real `pacman -Si`/Arch-wiki-sourced
# line each). REMOVE = rescue-media/live-boot/diagnostic-only tools, PXE/NFS
# network-boot machinery, the archiso-specific initramfs tooling itself, and
# Arch's own competing interactive installer - plus, by the identical
# "redundant once Calamares has already installed the system" logic, the
# installer's OWN packages (see below). `remove` (not `try_remove`) is
# deliberate: if any of these is somehow missing on a given target, that is
# worth failing loudly on rather than silently ignoring.
#
# Explicitly reconsidered and KEPT despite a plausible name-only guess:
# `gpm` ("a mouse server for the console and xterm" - sounds live-console-
# only) is actually a hard dependency of three kept general-purpose packages
# (confirmed via `pacman -Qi gpm`'s real "Required By": brltty - this
# project's own explicitly-kept accessibility tool - plus mc and vim).
# Removing it would break those, so it stays.
#
# calamares + kuura-installer-config: decided the same way as `archinstall`
# (docs/ISO_CONTRACT.md's own instruction) - once Calamares has installed
# the system there is no further use for the installer or its own
# configuration package on the TARGET (nobody re-runs it there; reinstalling
# means booting the live medium again, where a fresh copy already lives).
# kuura-installer-config must be removed in the SAME operation as calamares
# - it `depends=('calamares')` (confirmed: its own installed DESC on the
# live rootfs records `%DEPENDS%` / `calamares`), so removing calamares
# alone would fail with an unsatisfied-dependency error; pacman resolves a
# multi-target `remove` as one transaction, so listing both here together
# is sufficient (no -Rs/cascade needed, and none is used, matching this
# module's own default removal semantics - deliberately NOT cascading, so
# unrelated dependencies, e.g. qt6-declarative, python, are left alone, the
# same reasoning already applied to `archinstall`).
#
# calamares-debug was considered and is NOT listed: confirmed (`pacman -Q`
# against the real live rootfs) that only `calamares` itself, never
# calamares-debug, is actually installed on the live medium in the first
# place (packages.x86_64 never lists it) - there is nothing to remove.
#
# Removing Calamares' own binary from the TARGET chroot while Calamares
# itself keeps running is safe: Calamares executes from the LIVE squashfs
# (mounted read-only, independent of the target), never from the target
# mount this `pacman -R` operates against via arch-chroot - the same
# reasoning this project already relies on for shellprocess.conf deleting
# other live-session files out from under a still-running live session.
operations:
  - remove:
      - archinstall
      - calamares
      - kuura-installer-config
      - clonezilla
      - cloud-init
      - ddrescue
      - dmraid
      - edk2-shell
      - fsarchiver
      - gpart
      - grml-zsh-config
      - livecd-sounds
      - memtest86+
      - memtest86+-efi
      - mkinitcpio-archiso
      - mkinitcpio-nfs-utils
      - partclone
      - partimage
      - refind
      - syslinux
      - testdisk

# ---- Real upstream documentation (unchanged, for reference) ----
#
# Allowed package operations are:
#  - *install*, *try_install*: will call the package manager to
#       install one or more packages. The install target will
#       abort the whole installation if package-installation
#       fails, while try_install carries on. Packages may be
#       listed as (localized) names, or as (localized) package-data.
# - *localInstall*: this is used to call the package manager
#       to install a package from a path-to-a-package.
# - *remove*, *try_remove*: will call the package manager to
#       remove one or more packages. The remove target will
#       abort the whole installation if package-removal fails,
#       while try_remove carries on.
