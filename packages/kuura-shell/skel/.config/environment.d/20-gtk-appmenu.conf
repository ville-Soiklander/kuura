# Read by the systemd --user manager at session start (systemd's own
# environment.d(5) mechanism), BEFORE any user unit starts - see this
# directory's own 15-gtk-theme.conf.in for the full reasoning behind moving
# off ~/.config/plasma-workspace/env/*.sh (this file's former location and
# name: env/20-gtk-appmenu.sh).
#
# REAL product file (unlike harness/vm/guest/skel's own identically-purposed
# 10-vm-rendering.conf, which is test-image only). Promoted to a real
# product feature 2026-10-16 (project owner's explicit choice,
# `AskUserQuestion`): global-menu support for classic GtkMenuBar apps is a
# real, desired feature of this project's own desktop (the
# whole point of the panel's Global Menu widget), not merely a test
# convenience - `mousepad`'s own `app-menu-gtk` verification state exercises
# the exact same real mechanism every other GTK3 app with a menu bar needs.
#
# No @NAME@ substitution needed (unlike 15-gtk-theme.conf.in): this value
# does not depend on DISTRO_NAME, so this file installs as a plain static
# file, not a .in template.
GTK_MODULES=appmenu-gtk-module
