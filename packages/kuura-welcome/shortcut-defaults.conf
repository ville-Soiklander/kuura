# Upstream default key combinations that no installed file declares, read by the
# launcher only when neither the user's nor the product's kglobalshortcutsrc sets
# them (docs/WELCOME_CONTRACT.md, "Shortcuts").
#
# WHY this file exists: KWin compiles the Overview default in, so it appears in no
# file of any installed package; the live value only reaches ~/.config after the
# compositor has registered its actions, which may be later than the first login's
# welcome window. The value is the one the screenshot harness relies on
# (harness/states.toml, state "overview"); tests/test_welcome_package.py checks
# that the two stay equal.
#
# The search shortcut needs no entry: KRunner declares its own default in
# /usr/share/kglobalaccel/org.kde.krunner.desktop, which the launcher reads.
[kwin]
Overview=Meta+W
